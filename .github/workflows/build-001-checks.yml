name: Build 001 Checks

on:
  pull_request:
  push:
    branches:
      - build-001-foundation

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck mobile app
        run: pnpm --filter @localink/mobile typecheck
